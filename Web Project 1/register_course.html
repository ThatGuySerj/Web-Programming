<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="NicoStyles.css">
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <title>Course Registration System</title>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <header class="bg-dark text-white py-3 text-center">
        <h1>Course Registration System</h1>
    </header>

    <nav class="bg-secondary">
        <ul class="nav flex-column p-3">
            <li class="nav-item">
                <a class="nav-link text-white" href="Nico.html">Home Page</a>
            </li>
        </ul>
    </nav>
    
    <section class="container mt-4">
        <h2 class="mb-4 text-center">Register for a Course</h2>
        <form class="enrollstud card p-4 shadow-sm">

            <div class="mb-3">
                <label for="first_name" class="form-label">Student's First Name:</label>
                <input type="text" class="form-control" id="first_name" name="first_name" placeholder="Input First Name Here" required>
            </div>

            <div class="mb-3">
                <label for="last_name" class="form-label">Student's Last Name:</label>
                <input type="text" class="form-control" id="last_name" name="last_name" placeholder="Input Last Name Here" required>
            </div>

            <div class="mb-3">
                <label for="semester" class="form-label">Semester and Year:</label>
                <input type="text" class="form-control" id="semester" name="semester" placeholder="Input Semester Then Year Here" required>
            </div>

            <div class="mb-3">
                <label for="course_prefix" class="form-label">Course Prefix:</label>
                <input type="text" class="form-control" id="course_prefix" name="course_prefix" placeholder="Input Prefix Here" required>
            </div>

            <div class="mb-3">
                <label for="course_number" class="form-label">Course Number:</label>
                <input type="text" class="form-control" id="course_number" name="course_number" placeholder="Input Course Number Here" required>
            </div>

            <div class="mb-3">
                <label for="course_section" class="form-label">Course Section:</label>
                <input type="text" class="form-control" id="course_section" name="course_section" placeholder="Input Course Section Here" required>
            </div>

            <button type="submit" class="btn btn-success w-100">Register</button>
        </form>
    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
