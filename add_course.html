<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="NicoStyles.css">
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <title>Add Course</title>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <header class="bg-dark text-white py-3 text-center">
        <h1>Add Course</h1>
    </header>

    <nav class="bg-secondary">
        <ul class="nav flex-column p-3">
            <li class="nav-item">
                <a class="nav-link text-white" href="Nico.html">Home Page</a>
            </li>
        </ul>
    </nav>

    <section class="container mt-4">
        <h2 class="mb-4 text-center">Register a Course</h2>
        <form class="enrollstud card p-4 shadow-sm">

            <div class="form-group">
                <label for="semester">Semester and Year:</label>
                <select id="semester" name="semester" class="form-control" required>
                    <option value="Spring">Spring</option>
                    <option value="Summer">Summer</option>
                    <option value="Fall">Fall</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="course_prefix">Course Prefix:</label>
                    <input type="text" id="course_prefix" name="course_prefix" class="form-control" placeholder="Input Prefix Here" required>
                </div>

                <div class="form-group col-md-6">
                    <label for="course_number">Course Number:</label>
                    <input type="text" id="course_number" name="course_number" class="form-control" placeholder="Input Course Number Here" required>
                </div>
            </div>

            <div class="form-group">
                <label for="course_section">Course Section:</label>
                <input type="text" id="course_section" name="course_section" class="form-control" placeholder="Input Course Section Here" required>
            </div>

            <div class="form-group">
                <label for="course_name">Course Name:</label>
                <input type="text" id="course_name" name="course_name" class="form-control" placeholder="Input Course Name Here" required>
            </div>

            <div class="form-group">
                <label for="room">Room (Building & Room Number):</label>
                <input type="text" id="room" name="room" class="form-control" placeholder="Input Room Here" required>
            </div>

            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="days">Days Offered:</label>
                    <select id="days" name="days" class="form-control" required>
                        <option value="MWF">Monday, Wednesday, Friday</option>
                        <option value="MW">Monday, Wednesday</option>
                        <option value="TR">Tuesday, Thursday</option>
                        <option value="M">Monday</option>
                        <option value="T">Tuesday</option>
                        <option value="W">Wednesday</option>
                        <option value="R">Thursday</option>
                    </select>
                </div>

                <div class="form-group col-md-6">
                    <label for="time">Time:</label>
                    <select id="time" name="time" class="form-control" required>
                        <option value="8:00 AM - 8:50 AM">8:00 AM - 8:50 AM</option>
                        <option value="9:00 AM - 9:50 AM">9:00 AM - 9:50 AM</option>
                        <option value="10:00 AM - 10:50 AM">10:00 AM - 10:50 AM</option>
                        <option value="11:00 AM - 11:50 AM">11:00 AM - 11:50 AM</option>
                        <option value="1:00 PM - 2:15 PM">1:00 PM - 2:15 PM</option>
                        <option value="2:30 PM - 3:45 PM">2:30 PM - 3:45 PM</option>
                        <option value="7:00 PM - 9:30 PM">7:00 PM - 9:30 PM</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="credit_hours">Credit Hours:</label>
                <input type="text" id="credit_hours" name="credit_hours" class="form-control" placeholder="Input Credit Hours Here" required>
            </div>

            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="instructor_first_name">Instructor First Name:</label>
                    <input type="text" id="instructor_first_name" name="instructor_first_name" class="form-control" placeholder="Input First Name Here" required>
                </div>

                <div class="form-group col-md-6">
                    <label for="instructor_last_name">Instructor Last Name:</label>
                    <input type="text" id="instructor_last_name" name="instructor_last_name" class="form-control" placeholder="Input Last Name Here" required>
                </div>
            </div>

            <div class="form-group">
                <label for="enrollment_cap">Enrollment Cap:</label>
                <input type="text" id="enrollment_cap" name="enrollment_cap" class="form-control" placeholder="Input Enrollment Cap Here" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block mt-3">Add Course</button>
        </form>
    </section>


    <script>
        document.querySelector("form").addEventListener("submit", function (e) {
            e.preventDefault(); // Stop default submission
        
            // Grab form values
            const semester = document.getElementById("semester").value;
            const coursePrefix = document.getElementById("course_prefix").value.trim();
            const courseNumber = document.getElementById("course_number").value.trim();
            const courseSection = document.getElementById("course_section").value.trim();
            const courseName = document.getElementById("course_name").value.trim();
            const room = document.getElementById("room").value.trim();
            const days = document.getElementById("days").value;
            const time = document.getElementById("time").value;
            const creditHours = document.getElementById("credit_hours").value.trim();
            const instructorFirst = document.getElementById("instructor_first_name").value.trim();
            const instructorLast = document.getElementById("instructor_last_name").value.trim();
            const enrollmentCap = document.getElementById("enrollment_cap").value.trim();
        
            const errors = [];
        
            // VALIDATION RULES
            if (!/^[A-Z]{3,4}$/.test(coursePrefix)) {
                errors.push("Course Prefix must be 3 or 4 capital letters.");
            }
        
            if (!/^\d{3}$/.test(courseNumber) || parseInt(courseNumber) > 499) {
                errors.push("Course Number must be exactly 3 digits and ≤ 499.");
            }
        
            if (!/^\d{2}$/.test(courseSection)) {
                errors.push("Course Section must be exactly 2 digits.");
            }
        
            if (room && !/^[A-Za-z\s]+ \d{2,3}[A-Za-z]?$/.test(room)) {
                errors.push("Room must be like: Selby 101 or Rickey 220A.");
            }
        
            if (!/^[0-4](\.\d+)?$/.test(creditHours)) {
                errors.push("Credit Hours must be a number between 0 and 4.");
            }
        
            if (!/^[A-Za-z\s]+$/.test(instructorFirst)) {
                errors.push("Instructor First Name must contain only letters/spaces.");
            }
        
            if (!/^[A-Za-z\s]+$/.test(instructorLast)) {
                errors.push("Instructor Last Name must contain only letters/spaces.");
            }
        
            if (!/^\d{2}$/.test(enrollmentCap)) {
                errors.push("Enrollment Cap must be a two-digit number.");
            }
        
            // DISPLAY ERRORS OR SUBMITTED DATA
            if (errors.length > 0) {
                alert("Please fix these errors:\n\n" + errors.join("\n"));
                return;
            }
        
            // Format & show submission
            const message =
                `Semester: ${semester}\n` +
                `Course: ${coursePrefix} ${courseNumber} - Section ${courseSection}\n` +
                `Course Name: ${courseName}\n` +
                `Room: ${room}\n` +
                `Days: ${days}\n` +
                `Time: ${time}\n` +
                `Credit Hours: ${creditHours}\n` +
                `Instructor: ${instructorFirst} ${instructorLast}\n` +
                `Enrollment Cap: ${enrollmentCap}`;
        
            alert(message);
        });
        </script>
        
</body>
</html>
